{% macro airbnb_badge(url, price, label) -%}
  {% if url %}
    <a class="booking-airbnb-badge" href="{{ url }}" target="_blank" rel="noopener noreferrer" aria-label="{{ label }}: {{ price }}">
  {% else %}
    <span class="booking-airbnb-badge booking-airbnb-badge-static" aria-label="{{ label }}: {{ price }}">
  {% endif %}
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 3.1c-1.8 0-2.9 1.8-3.7 3.6l-4 9.1c-.9 2.1.2 4.6 2.5 5.1 2.2.5 3.8-1.6 5.2-3.8 1.4 2.2 3 4.3 5.2 3.8 2.3-.5 3.4-3 2.5-5.1l-4-9.1c-.8-1.8-1.9-3.6-3.7-3.6Zm0 5.4c1.5 2.2 2.8 4.2 2.8 5.7a2.8 2.8 0 1 1-5.6 0c0-1.5 1.3-3.5 2.8-5.7Z"/>
      </svg>
      <span>Airbnb:</span>
      <span class="booking-airbnb-price">{{ price }}</span>
  {% if url %}</a>{% else %}</span>{% endif %}
{%- endmacro %}
